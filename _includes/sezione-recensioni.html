{%- comment -%} "Dicono di noi": compare solo se _data/recensioni.yml contiene almeno una recensione {%- endcomment -%}
{%- if site.data.recensioni.size > 0 %}
    <!-- DICONO DI NOI -->
    <section class="section reviews" id="recensioni">
      <div class="container">
        <div class="section__head">
          <p class="kicker reveal">Dicono di noi</p>
          <h2 class="h2 reveal">La parola a chi <em>ci ha scelto.</em></h2>
        </div>
        <div class="reviews__grid">
          {%- for r in site.data.recensioni %}
          <figure class="review reveal">
            <svg class="review__mark" viewBox="0 0 32 24" aria-hidden="true"><path fill="currentColor" d="M0 24V14.4C0 6.1 4.3 1.3 12.6 0l1.3 3.1C9.4 4.4 7.3 7 7 11h6v13zm18 0V14.4C18 6.1 22.3 1.3 30.6 0l1.3 3.1c-4.5 1.3-6.6 3.9-6.9 7.9h6v13z"/></svg>
            <blockquote><p>{{ r.testo | escape | newline_to_br }}</p></blockquote>
            <figcaption>{{ r.nome | escape }}</figcaption>
          </figure>
          {%- endfor %}
        </div>
      </div>
    </section>
{%- endif %}
