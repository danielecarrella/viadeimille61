<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "InsuranceAgency",
    "@id": {{ '/#agenzia' | absolute_url | jsonify }},
    "name": {{ site.title | jsonify }},
    "legalName": {{ site.agenzia.ragione_sociale | jsonify }},
    "description": {{ site.description | jsonify }},
    "url": {{ '/' | absolute_url | jsonify }},
    "logo": {{ '/assets/img/logo.png' | absolute_url | jsonify }},
    "image": {{ '/assets/img/logo.png' | absolute_url | jsonify }},
    "telephone": {{ site.agenzia.telefono_link | jsonify }},
    "email": {{ site.agenzia.email | jsonify }},
    "address": {
      "@type": "PostalAddress",
      "streetAddress": {{ site.agenzia.indirizzo | jsonify }},
      "postalCode": {{ site.agenzia.cap | jsonify }},
      "addressLocality": {{ site.agenzia.comune | jsonify }},
      "addressRegion": {{ site.agenzia.provincia | jsonify }},
      "addressCountry": "IT"
    },
    "hasMap": {{ site.agenzia.maps | jsonify }},
    "openingHoursSpecification": [
      {%- for o in site.agenzia.orari_schema %}
      {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": {{ o.giorni | jsonify }},
        "opens": {{ o.apre | jsonify }},
        "closes": {{ o.chiude | jsonify }}
      }{% unless forloop.last %},{% endunless %}
      {%- endfor %}
    ]
  }
  </script>
