<!DOCTYPE html>
<html lang="it">
<head>
  {% include head.html %}
</head>
<body data-email="{{ site.agenzia.email }}" class="{% if page.home %}is-home{% else %}is-page{% endif %}{% if site.agenzia.whatsapp and site.agenzia.whatsapp != '' %} has-wa{% endif %}">

  {% include header.html %}

  <main id="top">
{{ content }}
  </main>

  {% include footer.html %}
  {% include whatsapp.html %}

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  {%- if page.home %}
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
  </script>
  <script type="module" src="{{ '/assets/js/scene.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}"></script>
  {%- endif %}
  <script src="{{ '/assets/js/main.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M' }}"></script>
</body>
</html>
