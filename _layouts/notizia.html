---
layout: default
---
<article class="article">
  <header class="page-hero">
    <div class="container">
      <a class="page-hero__back" href="{{ '/novita/' | relative_url }}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
        Tutte le novità
      </a>
      <p class="kicker"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{% include data-it.html data=page.date %}</time></p>
      <h1 class="page-hero__title">{{ page.titolo }}</h1>
    </div>
  </header>

  <div class="section article__section">
    <div class="container article__inner">
      {%- if page.immagine %}
      <img class="article__img" src="{{ page.immagine | relative_url }}" alt="">
      {%- endif %}
      <div class="article__body">
{{ content }}
      </div>
      <div class="article__cta">
        <p>Hai domande? Siamo in agenzia, in {{ site.agenzia.indirizzo }}.</p>
        <a href="{{ '/' | relative_url }}#contatti" class="btn btn--dark">
          Contattaci
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </div>
    </div>
  </div>
</article>
